<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Promises to Creation</title>
  <script>
    // Single Page Apps for GitHub Pages (Clean URL Router Redirect)
    // Supports custom domains (promisestocreation.org) and github.io subpaths
    var pathSegmentsToKeep = (window.location.hostname.endsWith('github.io') && window.location.pathname.split('/').length > 2) ? 1 : 0;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
